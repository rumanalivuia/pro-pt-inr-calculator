<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005fc8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)" filter="url(#glow)"/>

  <!-- Inner highlight ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Medical cross at top -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="110" x2="256" y2="170"/>
    <line x1="226" y1="140" x2="286" y2="140"/>
  </g>

  <!-- ECG waveform -->
  <path d="
    M 80 256
    L 150 256
    Q 170 256 170 220
    Q 170 190 200 190
    Q 230 190 230 220
    L 230 256
    L 270 256
    L 270 120
    L 300 392
    L 330 180
    L 360 256
    L 432 256
  "
  stroke="#ffffff"
  stroke-width="5"
  stroke-linecap="round"
  stroke-linejoin="round"
  fill="none"
  filter="url(#glow)"/>

  <!-- PT/INR text -->
  <text x="256" y="370"
        font-family="Arial, sans-serif"
        font-size="56"
        font-weight="bold"
        fill="#ffffff"
        text-anchor="middle"
        filter="url(#glow)">PT/INR</text>

  <!-- Small indicator dots -->
  <circle cx="180" cy="300" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="332" cy="300" r="4" fill="#ffffff" opacity="0.6"/>
</svg>